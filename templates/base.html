<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}Django Blog{% endblock %}</title>
    <style>
        body .products-page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .product-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .product-card {
            background: #fff;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
        }

        .product-card h2 {
            margin-bottom: 10px;
        }

        .price {
            font-weight: bold;
            margin-top: 12px;
        }

        .pagination {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .page-btn {
            padding: 8px 14px;
            border-radius: 8px;
            background: #f2f2f2;
            text-decoration: none;
            color: #333;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .page-btn:hover {
            background: #000;
            color: #fff;
        }

        .page-info {
            padding: 8px 14px;
            border-radius: 8px;
            background: #eaeaea;
            font-weight: 600;
        }


    </style>
</head>

<body>

<main>
    {% block content %}{% endblock %}
    {% block paginator %}{% endblock %}
</main>

</body>

</html>
