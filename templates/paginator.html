<div class="pagination">
    {% if page_obj.has_previous %}
        <a class="page-btn" href="?page=1">&laquo;</a>
        <a class="page-btn" href="?page={{ page_obj.previous_page_number }}">‹</a>
    {% endif %}

    <span class="page-info">
        {{ page_obj.number }} / {{ page_obj.paginator.num_pages }}
    </span>

    {% if page_obj.has_next %}
        <a class="page-btn" href="?page={{ page_obj.next_page_number }}">›</a>
        <a class="page-btn" href="?page={{ page_obj.paginator.num_pages }}">&raquo;</a>
    {% endif %}
</div>
